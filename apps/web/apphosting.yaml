runConfig:
  runtime: nodejs22
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_MCP_URL
    secret: NEXT_PUBLIC_MCP_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_POSTHOG_KEY
    secret: NEXT_PUBLIC_POSTHOG_KEY
    availability:
      - BUILD
      - RUNTIME
  # Public EU ingest host — not a secret.
  - variable: NEXT_PUBLIC_POSTHOG_HOST
    value: https://eu.i.posthog.com
    availability:
      - BUILD
      - RUNTIME
  # Public origin of this site. Sets metadataBase so og:image resolves to an
  # absolute URL for link previews. Stored as a secret only because docs/DEPLOY.md
  # keeps real hosts out of the public tree, not because the value is sensitive.
  - variable: NEXT_PUBLIC_SITE_URL
    secret: NEXT_PUBLIC_SITE_URL
    availability:
      - BUILD
      - RUNTIME
