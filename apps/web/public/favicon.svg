<!--
  SuperMCP mark: a shopping basket with one item going into it.

  Concept generated with Recraft via Higgsfield, then rebuilt by hand. The
  model's own output was 1.9KB of bezier approximations whose details mushed
  together below about 24px; this is the same idea in exact geometry.

  Two design constraints, both found by testing at real sizes:
   - No handle. An arc over a rounded body reads as a padlock at every size.
   - The body flares outward at the rim. A plain taper reads as a waste bin.

  The item is drawn BEFORE the basket so the rim occludes it: it is going in,
  not sitting in front. Colours are literal hex, not oklch, because favicon
  renderers are not full browsers. #006598 is --color-accent, #FC9B6F is
  --color-over-band.

  Geometry is mirrored in src/components/shared/Logo.tsx. Keep them in step.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SuperMCP">
  <rect width="32" height="32" rx="7.5" fill="#006598"/>
  <rect x="13.9" y="7.4" width="4.6" height="4.6" rx="1.15" fill="#FC9B6F"/>
  <path d="M6.8 12.6 H25.2 A1.3 1.3 0 0 1 26.5 14.2 L23 25.1 Q22.7 26.1 21.6 26.1 H10.4 Q9.3 26.1 9 25.1 L5.5 14.2 A1.3 1.3 0 0 1 6.8 12.6 Z" fill="#fff"/>
</svg>
