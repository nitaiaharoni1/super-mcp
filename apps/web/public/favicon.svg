<!--
  SuperMCP mark: a shopping basket whose body is a barcode.

  Concept from the brand PNG, rebuilt as exact geometry so it stays sharp at
  16px in a tab. The handle is an open trapezoid (no base), the body is eight
  vertical bars of uneven width — basket + price-scan in one mark.

  Colours are literal hex, not oklch, because favicon renderers are not full
  browsers. #9747FF is the brand grape of the sticker-ledger system.

  Geometry is mirrored in src/components/shared/Logo.tsx and brand/og.html.
  Keep them in step.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SuperMCP">
  <rect width="32" height="32" rx="7.5" fill="#9747FF"/>
  <!-- Handle: open trapezoid, stroke weight matches the source mark -->
  <path
    d="M6.2 15.0 L11.2 8.5 H20.8 L25.8 15.0"
    fill="none"
    stroke="#fff"
    stroke-width="1.4"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />
  <!-- Basket body as barcode bars -->
  <rect x="5.84" y="14.9" width="2.22" height="9.9" fill="#fff"/>
  <rect x="8.91" y="14.9" width="1.53" height="9.9" fill="#fff"/>
  <rect x="11.28" y="14.9" width="1.84" height="9.9" fill="#fff"/>
  <rect x="13.97" y="14.9" width="0.78" height="9.9" fill="#fff"/>
  <rect x="15.59" y="14.9" width="2.84" height="9.9" fill="#fff"/>
  <rect x="19.31" y="14.9" width="2.16" height="9.9" fill="#fff"/>
  <rect x="22.31" y="14.9" width="0.78" height="9.9" fill="#fff"/>
  <rect x="23.94" y="14.9" width="2.25" height="9.9" fill="#fff"/>
</svg>
