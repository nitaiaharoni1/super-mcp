<!--
  Super MCP mark: the same product at two prices, and which one we pick.

  Two right-aligned bars (right-aligned because the product is Hebrew RTL). The
  long faint bar is what the nearer shop charges; the short solid bar is the
  answer. That is the whole product in two rectangles, and unlike a letterform
  it still reads at 16px.

  Geometry is mirrored in src/components/shared/Logo.tsx. Keep them in step.
  Colours are literal hex, not oklch: favicon renderers are not full browsers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Super MCP">
  <rect width="32" height="32" rx="7.5" fill="#006598"/>
  <rect x="7" y="10.25" width="18" height="3.5" rx="1.75" fill="#fff" opacity=".45"/>
  <rect x="14" y="18.25" width="11" height="3.5" rx="1.75" fill="#fff"/>
</svg>
