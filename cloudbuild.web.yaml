# Builds the marketing image (apps/web/Dockerfile) with the values Next bakes into
# the page. The API image needs none of this and still builds with a plain
# `gcloud builds submit --tag=...`; this file exists only because `--tag` cannot
# pass --build-arg, and a marketing build without those args silently ships a page
# pointing at localhost. See docs/DEPLOY.md and apps/web/src/scripts/checkPublicEnv.mjs.
#
#   gcloud builds submit --config=cloudbuild.web.yaml \
#     --substitutions=_MCP_URL=<site>/mcp,_SITE_URL=<site>,_POSTHOG_KEY=<key>,_TAG=$(git rev-parse --short HEAD) .
#
# The substitutions default to empty on purpose: docs/DEPLOY.md keeps production
# hostnames out of the tree, and the build refuses rather than guesses.
substitutions:
  _MCP_URL: ""
  _SITE_URL: ""
  _POSTHOG_KEY: ""
  _POSTHOG_HOST: "https://eu.i.posthog.com"
  _IMAGE: "europe-west1-docker.pkg.dev/$PROJECT_ID/super-mcp/web"
  _TAG: "$SHORT_SHA"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg=NEXT_PUBLIC_MCP_URL=${_MCP_URL}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_POSTHOG_KEY=${_POSTHOG_KEY}
      - --build-arg=NEXT_PUBLIC_POSTHOG_HOST=${_POSTHOG_HOST}
      - -t
      - ${_IMAGE}:${_TAG}
      - .

images:
  - ${_IMAGE}:${_TAG}

options:
  machineType: E2_HIGHCPU_8

timeout: 1800s
